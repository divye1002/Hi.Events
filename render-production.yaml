services:
  - type: web
    name: hi-events-backend
    env: docker
    rootDir: backend
    dockerfilePath: Dockerfile
    dockerContext: .
    plan: free  # or starter/standard for production
    envVars:
      - key: APP_NAME
        value: Hi.Events
      - key: APP_ENV
        value: production
      - key: APP_KEY
        generateValue: true
      - key: APP_DEBUG
        value: false
      - key: APP_URL
        value: https://your-backend-service.onrender.com
      - key: APP_FRONTEND_URL
        value: https://your-frontend.vercel.app
      - key: APP_CDN_URL
        value: https://your-backend-service.onrender.com/storage
      
      # Database - use Render PostgreSQL
      - key: DB_CONNECTION
        value: pgsql
      - fromDatabase:
          name: hi-events-db
          property: host
        key: DB_HOST
      - fromDatabase:
          name: hi-events-db
          property: database
        key: DB_DATABASE
      - fromDatabase:
          name: hi-events-db
          property: user
        key: DB_USERNAME
      - fromDatabase:
          name: hi-events-db
          property: password
        key: DB_PASSWORD
      - key: DB_PORT
        value: 5432
      
      # Mail Configuration (Your Postmark)
      - key: MAIL_MAILER
        value: smtp
      - key: MAIL_HOST
        value: smtp.postmarkapp.com
      - key: MAIL_PORT
        value: 587
      - key: MAIL_USERNAME
        value: b2d0eecf-bb58-47bf-b0da-8de5611645e0
      - key: MAIL_PASSWORD
        value: b2d0eecf-bb58-47bf-b0da-8de5611645e0
      - key: MAIL_ENCRYPTION
        value: tls
      - key: MAIL_FROM_ADDRESS
        value: divye@skoch.in
      - key: MAIL_FROM_NAME
        value: Hi.Events
      
      # Other settings
      - key: CACHE_DRIVER
        value: file
      - key: FILESYSTEM_PUBLIC_DISK
        value: public
      - key: FILESYSTEM_PRIVATE_DISK
        value: local
      - key: QUEUE_CONNECTION
        value: database
      - key: SESSION_DRIVER
        value: file
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: info
      - key: JWT_SECRET
        value: 2hoccgHb9r1fqW1lU16C6khSHVa7O0eai6FxkWK95UtQ0LqNDTO5mq1RzDwcq18I
      - key: JWT_ALGO
        value: HS256

databases:
  - name: hi-events-db
    databaseName: hievents
    user: hievents
