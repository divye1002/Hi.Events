version: '3.8'

services:
  # Hi.Events Application (All-in-One)
  app:
    build:
      context: .
      dockerfile: Dockerfile.all-in-one
    container_name: hievents-app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./backend/storage:/app/backend/storage
      - ./backend/.env:/app/backend/.env
      - ./ssl:/etc/ssl/certs
      - app_storage:/app/backend/storage/app/public
    environment:
      - APP_ENV=production
      - CONTAINER_ROLE=app
    depends_on:
      - db
      - redis
    restart: unless-stopped
    networks:
      - hievents-network

  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: hievents-db
    environment:
      POSTGRES_DB: hievents
      POSTGRES_USER: hievents
      POSTGRES_PASSWORD: secure_database_password_here
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - hievents-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hievents"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: hievents-redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - hievents-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Nginx Proxy (Optional - for SSL termination)
  nginx:
    image: nginx:alpine
    container_name: hievents-nginx
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/ssl/certs:ro
      - app_storage:/var/www/storage:ro
    depends_on:
      - app
    restart: unless-stopped
    networks:
      - hievents-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  app_storage:
    driver: local

networks:
  hievents-network:
    driver: bridge
