services:
  - type: web
    name: hievents-backend
    env: docker
    rootDir: backend
    dockerfilePath: Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    branch: develop
    envVars:
      - key: APP_NAME
        value: Hi.Events
      - key: APP_ENV
        value: production
      - key: APP_KEY
        generateValue: true
      - key: APP_DEBUG
        value: false
      - key: APP_URL
        value: https://hievents-backend.onrender.com
      - key: APP_FRONTEND_URL
        value: https://hi-events.vercel.app
      - key: APP_CDN_URL
        value: https://hievents-backend.onrender.com/storage
      
      # Database (PostgreSQL)
      - key: DB_CONNECTION
        value: pgsql
      - fromDatabase:
          name: hievents-db
          property: host
        key: DB_HOST
      - fromDatabase:
          name: hievents-db
          property: port
        key: DB_PORT
      - fromDatabase:
          name: hievents-db
          property: database
        key: DB_DATABASE
      - fromDatabase:
          name: hievents-db
          property: user
        key: DB_USERNAME
      - fromDatabase:
          name: hievents-db
          property: password
        key: DB_PASSWORD
      - fromDatabase:
          name: hievents-db
          property: connectionString
        key: DATABASE_URL
      
      # Mail Configuration - Postmark SMTP enabled
      - key: MAIL_MAILER
        value: smtp
      - key: MAIL_HOST
        value: smtp.postmarkapp.com
      - key: MAIL_PORT
        value: 587
      - key: MAIL_USERNAME
        value: b2d0eecf-bb58-47bf-b0da-8de5611645e0
      - key: MAIL_PASSWORD
        value: b2d0eecf-bb58-47bf-b0da-8de5611645e0
      - key: MAIL_ENCRYPTION
        value: tls
      - key: MAIL_FROM_ADDRESS
        value: divye@skoch.in
      - key: MAIL_FROM_NAME
        value: Hi.Events
      
      # Cache and Storage
      - key: CACHE_DRIVER
        value: file
      - key: FILESYSTEM_PUBLIC_DISK
        value: public
      - key: FILESYSTEM_PRIVATE_DISK
        value: local
      - key: QUEUE_CONNECTION
        value: database
      - key: SESSION_DRIVER
        value: file
      - key: SESSION_LIFETIME
        value: 120
      
      # Logging
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: info
      
      # Security
      - key: JWT_SECRET
        value: 2hoccgHb9r1fqW1lU16C6khSHVa7O0eai6FxkWK95UtQ0LqNDTO5mq1RzDwcq18I
      - key: JWT_ALGO
        value: HS256
      
      # Email Configuration - Enable for testing
      - key: APP_ENFORCE_EMAIL_CONFIRMATION_DURING_REGISTRATION
        value: true
      
      # CORS
      - key: CORS_ALLOWED_ORIGINS
        value: https://hi-events.vercel.app,https://hievents-backend.onrender.com
      
      # Optional: Disable registration
      - key: APP_DISABLE_REGISTRATION
        value: false
      - key: APP_PLATFORM_SUPPORT_EMAIL
        value: divye@skoch.in

  # Queue Worker Service - Processes email jobs
  - type: worker
    name: hievents-queue-worker
    env: docker
    rootDir: backend
    dockerfilePath: Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    branch: develop
    dockerCommand: php artisan queue:work --verbose --tries=3 --timeout=90
    envVars:
      - key: APP_NAME
        value: Hi.Events
      - key: APP_ENV
        value: production
      - key: APP_KEY
        generateValue: true
      - key: APP_DEBUG
        value: false
      - key: APP_URL
        value: https://hievents-backend.onrender.com
      - key: APP_FRONTEND_URL
        value: https://hi-events.vercel.app
      - key: APP_CDN_URL
        value: https://hievents-backend.onrender.com/storage
      
      # Database (PostgreSQL)
      - key: DB_CONNECTION
        value: pgsql
      - fromDatabase:
          name: hievents-db
          property: host
        key: DB_HOST
      - fromDatabase:
          name: hievents-db
          property: port
        key: DB_PORT
      - fromDatabase:
          name: hievents-db
          property: database
        key: DB_DATABASE
      - fromDatabase:
          name: hievents-db
          property: user
        key: DB_USERNAME
      - fromDatabase:
          name: hievents-db
          property: password
        key: DB_PASSWORD
      
      # Mail Configuration - Postmark SMTP enabled
      - key: MAIL_MAILER
        value: smtp
      - key: MAIL_HOST
        value: smtp.postmarkapp.com
      - key: MAIL_PORT
        value: 587
      - key: MAIL_USERNAME
        value: b2d0eecf-bb58-47bf-b0da-8de5611645e0
      - key: MAIL_PASSWORD
        value: b2d0eecf-bb58-47bf-b0da-8de5611645e0
      - key: MAIL_ENCRYPTION
        value: tls
      - key: MAIL_FROM_ADDRESS
        value: divye@skoch.in
      - key: MAIL_FROM_NAME
        value: Hi.Events
      
      # Cache and Storage
      - key: CACHE_DRIVER
        value: file
      - key: FILESYSTEM_PUBLIC_DISK
        value: public
      - key: FILESYSTEM_PRIVATE_DISK
        value: local
      - key: QUEUE_CONNECTION
        value: database
      - key: SESSION_DRIVER
        value: file
      - key: SESSION_LIFETIME
        value: 120
      
      # Logging
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: info
      
      # Security
      - key: JWT_SECRET
        value: 2hoccgHb9r1fqW1lU16C6khSHVa7O0eai6FxkWK95UtQ0LqNDTO5mq1RzDwcq18I
      - key: JWT_ALGO
        value: HS256
      
      # Email Configuration - Enable for testing
      - key: APP_ENFORCE_EMAIL_CONFIRMATION_DURING_REGISTRATION
        value: true
      
      # CORS
      - key: CORS_ALLOWED_ORIGINS
        value: https://hi-events.vercel.app,https://hievents-backend.onrender.com
      
      # Optional: Disable registration
      - key: APP_DISABLE_REGISTRATION
        value: false
      - key: APP_PLATFORM_SUPPORT_EMAIL
        value: divye@skoch.in

databases:
  - name: hievents-db
    databaseName: hievents
    user: hievents
    plan: free
